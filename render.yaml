services:
  - type: web
    name: nlpchat
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm install --prefix backend && npm install --prefix frontend --include=dev && npm run --prefix frontend build
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.11.0
      - key: JWT_SECRET
        generateValue: true
